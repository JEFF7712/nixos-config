shell_integration no-rc

# BEGIN_KITTY_THEME
# Noctalia
include colors.conf
# END_KITTY_THEME

# BEGIN_KITTY_FONTS
font_family      family="Iosevka Nerd Font"
bold_font        auto
italic_font      auto
bold_italic_font auto

font_size 14

# END_KITTY_FONTS

background_opacity 0.4
dynamic_background_opacity yes
# Rewritten live by sync-kitty-agent-colors from the active colors.conf.
transparent_background_colors #202020 #2a2a2f #303030 #232323 #0a0a0a #373737 #262626
enable_audio_bell no

# GPU cursor smear; rewritten live by apply_profile_appearance_files.
cursor_trail 3
cursor_trail_decay 0.1 0.4
cursor_trail_start_threshold 2

# Cap in-RAM scrollback; long-lived sessions were holding GBs.
scrollback_lines 10000
scrollback_pager_history_size 100
