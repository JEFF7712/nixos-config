name: Build ISO

# This does not publish. GitHub caps release assets at 2 GiB and a graphical,
# repo-cloning installer ISO does not fit under that without giving up niri,
# Qt and Firefox, so the image is consumed locally: `just build-iso` then
# `writeUSB` (see docs/luks-reinstall.md). What CI is for is catching a broken
# or ballooning ISO early -- it previously only ran on `v*` tags, so it sat
# unbuilt from 2025-12-21 to 2026-08-26 while the image grew to 5.86 GiB.
#
# Runs on the nas-01 self-hosted runner (homelab-new
# flake/modules/github-runner-nixos.nix): warm store plus the LAN Attic cache
# keep rebuilds incremental, and the finished image is pushed back to Attic so
# `just build-iso` on any homelab machine substitutes instead of rebuilding.
# Needs the repo secret ATTIC_TOKEN (Attic JWT with push on the homelab cache);
# without it the build still runs, only the push step is skipped.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'hosts/iso/**'
      - 'home/rupan/iso.nix'
      - 'flake.lock'
      - '.github/workflows/build-iso.yml'
  schedule:
    # Monthly, so nixpkgs drift surfaces without waiting for an ISO edit.
    - cron: '0 6 1 * *'

# Self-hosted runner: cancel superseded runs so rapid pushes do not queue
# multi-minute ISO builds behind each other.
concurrency:
  group: build-iso-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-iso:
    runs-on: [self-hosted, homelab, nixos]
    env:
      ATTIC_ENDPOINT: http://10.0.30.20:8080
    steps:
    - name: Checkout Code
      uses: actions/checkout@v7

    - name: Build ISO
      run: |
        nix build .#nixosConfigurations.iso.config.system.build.isoImage --print-out-paths | tee /tmp/iso-out-paths.txt
        ISO_PATH=$(readlink -f result/iso/*.iso)
        FILE_SIZE=$(stat -c%s "$ISO_PATH")
        echo "ISO size: $FILE_SIZE bytes ($(numfmt --to=iec "$FILE_SIZE"))"
        echo "iso-size=$FILE_SIZE" >> "$GITHUB_OUTPUT"
        {
          echo "### ISO built"
          echo "\`$(basename "$ISO_PATH")\` — $(numfmt --to=iec "$FILE_SIZE")"
        } >> "$GITHUB_STEP_SUMMARY"
        # Advisory tripwire, not a distribution limit: this only fires if the
        # image roughly doubles, which means something large leaked back in.
        if [ "$FILE_SIZE" -gt 6442450944 ]; then
          echo "::error::ISO ballooned past 6 GiB ($FILE_SIZE bytes) — check what got pulled into hosts/iso or home/rupan/iso.nix"
          exit 1
        fi
        if [ "$FILE_SIZE" -gt 4294967296 ]; then
          echo "::warning::ISO is over 4 GiB ($FILE_SIZE bytes)"
        fi

    - name: Push ISO closure to Attic
      env:
        ATTIC_TOKEN: ${{ secrets.ATTIC_TOKEN }}
      run: |
        if [ -z "${ATTIC_TOKEN:-}" ]; then
          echo "ATTIC_TOKEN is not set; skipping Attic push."
          exit 0
        fi
        attic login homelab "$ATTIC_ENDPOINT" "$ATTIC_TOKEN"
        attic push homelab "$(cat /tmp/iso-out-paths.txt)"
