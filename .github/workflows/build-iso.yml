name: Build and Release ISO

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-iso:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Checkout Code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Free Disk Space (Ubuntu)
      uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
      with:
        tool-cache: true
        android: true
        dotnet: true
        haskell: true
        large-packages: true
        docker-images: true
        swap-storage: false

    # 1. Install Nix
    - name: Install Nix
      uses: DeterminateSystems/nix-installer-action@33c9ab3ef95cd57c164d9d6eb1f9a46338538d41 # main

    # 2. Binary cache (magic-nix-cache was discontinued upstream)
    - name: Cachix
      uses: cachix/cachix-action@5f2d7c5294214f71b873db4b969586b980625e71 # v17
      with:
        name: jeff7712
        authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'

    # 3. Build the ISO
    - name: Build ISO
      run: |
        nix build .#nixosConfigurations.iso.config.system.build.isoImage
        ISO_PATH=$(readlink -f result/iso/*.iso)
        FILE_SIZE=$(stat -c%s "$ISO_PATH")
        if [ "$FILE_SIZE" -gt 2147483648 ]; then
          echo "❌ ISO is too big: $FILE_SIZE bytes"
          exit 1
        fi
        cp "$ISO_PATH" rupan-nixos.iso
        sha256sum rupan-nixos.iso > rupan-nixos.iso.sha256

    - name: Create Release
      uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
      with:
        files: |
          rupan-nixos.iso
          rupan-nixos.iso.sha256
        draft: false
        prerelease: false
