name: Check
on:
  push:
    branches: [main]
  pull_request:

# Self-hosted runners on nas-01: cancel superseded runs so rapid pushes do
# not queue stale jobs behind each other.
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

# Runs on the nas-01 self-hosted runners (homelab-new
# flake/modules/github-runner-nixos.nix). Warm /nix/store plus the LAN Attic
# cache is what makes this fast; there is deliberately no Nix installer,
# Cachix, or GH-cache step. Tool installs resolve from this flake's locked
# nixpkgs via --inputs-from so CI uses the same revisions as local dev.
# check.yml is secret-free by design, so fork PRs cannot exfiltrate anything.
jobs:
  validate:
    runs-on: [self-hosted, homelab, nixos]
    steps:
      - uses: actions/checkout@v7
      - name: Check formatting
        run: nix fmt -- --fail-on-change --no-cache
      - name: Check flake
        run: nix flake check --no-write-lock-file
      - name: Fast checks
        run: |
          nix shell --inputs-from . nixpkgs#just nixpkgs#jq nixpkgs#nixfmt nixpkgs#shellcheck nixpkgs#ripgrep nixpkgs#fd nixpkgs#python3 -c \
            bash -c 'just check-agent-docs && just check-agent-workflows && just shell-check && just check-flake-update && just check-laptop-safety && just impermanence-check && just check-local-bin && just lid-close-check'

  profiles:
    runs-on: [self-hosted, homelab, nixos]
    steps:
      - uses: actions/checkout@v7
      - name: Profile and theme checks
        run: |
          nix shell --inputs-from . nixpkgs#just nixpkgs#python3 nixpkgs#matugen nixpkgs#ripgrep nixpkgs#jq .#iris-python -c \
            bash -c 'just wallpaper-script-check && just check-profiles && just qml-lint && just xhisper-check && just plymouth-theme-check'
