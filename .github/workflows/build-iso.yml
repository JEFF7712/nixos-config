name: Build ISO

# This does not publish. GitHub caps release assets at 2 GiB and a graphical,
# repo-cloning installer ISO does not fit under that without giving up niri,
# Qt and Firefox, so the image is consumed locally: `just build-iso` then
# `writeUSB` (see docs/luks-reinstall.md). What CI is for is catching a broken
# or ballooning ISO early -- it previously only ran on `v*` tags, so it sat
# unbuilt from 2025-12-21 to 2026-08-26 while the image grew to 5.86 GiB.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'hosts/iso/**'
      - 'home/rupan/iso.nix'
      - 'flake.lock'
      - '.github/workflows/build-iso.yml'
  schedule:
    # Monthly, so nixpkgs drift surfaces without waiting for an ISO edit.
    - cron: '0 6 1 * *'

jobs:
  build-iso:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Free Disk Space (Ubuntu)
      uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
      with:
        tool-cache: true
        android: true
        dotnet: true
        haskell: true
        large-packages: true
        docker-images: true
        swap-storage: false

    - name: Install Nix
      uses: DeterminateSystems/nix-installer-action@33c9ab3ef95cd57c164d9d6eb1f9a46338538d41 # main

    - name: Cachix
      uses: cachix/cachix-action@5f2d7c5294214f71b873db4b969586b980625e71 # v17
      with:
        name: jeff7712
        authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'

    - name: Build ISO
      run: |
        nix build .#nixosConfigurations.iso.config.system.build.isoImage
        ISO_PATH=$(readlink -f result/iso/*.iso)
        FILE_SIZE=$(stat -c%s "$ISO_PATH")
        echo "ISO size: $FILE_SIZE bytes ($(numfmt --to=iec "$FILE_SIZE"))"
        echo "iso-size=$FILE_SIZE" >> "$GITHUB_OUTPUT"
        {
          echo "### ISO built"
          echo "\`$(basename "$ISO_PATH")\` — $(numfmt --to=iec "$FILE_SIZE")"
        } >> "$GITHUB_STEP_SUMMARY"
        # Advisory tripwire, not a distribution limit: this only fires if the
        # image roughly doubles, which means something large leaked back in.
        if [ "$FILE_SIZE" -gt 6442450944 ]; then
          echo "::error::ISO ballooned past 6 GiB ($FILE_SIZE bytes) — check what got pulled into hosts/iso or home/rupan/iso.nix"
          exit 1
        fi
        if [ "$FILE_SIZE" -gt 4294967296 ]; then
          echo "::warning::ISO is over 4 GiB ($FILE_SIZE bytes)"
        fi
