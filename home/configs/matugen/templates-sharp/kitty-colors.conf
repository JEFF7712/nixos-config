# sharp — wallpaper-driven (matugen). Monotone: every slot is either a surface
# tone (surface_container_* / on_surface*) or an accent hue that still reads as
# text on that surface (source_color = bright accent, primary = toned accent).
# Do not use on_primary / on_*_container: at matugenContrast 0.5 those are ink
# for a light container fill, so they go #000000 in dark and #ffffff in light.
# Backgrounds use surface_container_lowest so the terminal stays near-black
# rather than M3's lighter default surface. No secondary/tertiary/error hues.
cursor {{colors.source_color.default.hex}}
cursor_text_color {{colors.surface_container_lowest.default.hex}}
foreground {{colors.on_surface.default.hex}}
background {{colors.surface_container_lowest.default.hex}}
selection_foreground {{colors.on_surface.default.hex}}
selection_background {{colors.surface_container_high.default.hex}}
color0  {{colors.surface_container_low.default.hex}}
color8  {{colors.on_surface_variant.default.hex}}
color1  {{colors.source_color.default.hex}}
color9  {{colors.source_color.default.hex}}
color2  {{colors.primary.default.hex}}
color10 {{colors.primary.default.hex}}
color3  {{colors.primary.default.hex}}
color11 {{colors.primary.default.hex}}
color4  {{colors.source_color.default.hex}}
color12 {{colors.source_color.default.hex}}
color5  {{colors.primary.default.hex}}
color13 {{colors.primary.default.hex}}
color6  {{colors.primary.default.hex}}
color14 {{colors.primary.default.hex}}
color7  {{colors.on_surface_variant.default.hex}}
color15 {{colors.on_surface.default.hex}}
